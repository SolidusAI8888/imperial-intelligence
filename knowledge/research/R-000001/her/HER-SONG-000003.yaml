title: "后周显德七年：陈桥兵变中赵匡胤受拥立并约束军纪"
record_type: event
dynasty: Song
time_label: "后周显德七年"
participants:
  - song_taizu
historical_record: >-
  北汉与契丹入寇后，赵匡胤率军出征至陈桥驿。军士聚集拥立赵匡胤为天子。
  《宋史》记载其受拥立后向诸将提出不得惊犯太后与主上、不得侵凌大臣、不得侵掠府库与士庶之家等约束，诸将随后整队入京。
