supported_claims:
  - "李世民在隋末与唐初的战争环境中亲历高不确定性的创业阶段。"
  - "在霍邑进军前，高祖曾考虑退还太原，李世民明确反对，并说明退兵可能导致军心离散和后方受敌。"
  - "《旧唐书》《新唐书》对这一关键判断及高祖最终继续进军均有相互印证的记载。"
unsupported_claims:
  - "李世民在青年时期已经形成了后来完整的守成思想。"
  - "这次判断足以证明李世民此后所有重大决策均正确。"
  - "乱世中的个人选择可以消除时代、资源和结构条件的限制。"
