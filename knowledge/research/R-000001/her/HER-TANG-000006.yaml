title: "隋末至武德初：李世民在乱世中的主动判断与行动"
record_type: event
dynasty: Tang
time_label: "隋末至武德初"
participants:
  - tang_taizong
historical_record: >-
  隋末天下动乱时，李世民参与救援雁门、太原起兵与霍邑进军等关键行动。
  《旧唐书》记载高祖一度因久雨粮尽准备还太原，李世民反对退兵，认为既以大义起兵，
  若遇小敌即返，追随者将离散；《新唐书》亦记载同一事件，称李世民坚持应直入咸阳、
  号令天下，并以退兵将导致众散敌乘说明其判断。两书均记录高祖最终改变决定，继续进军。
