historical_record: >-
  贞观十年，唐太宗问侍臣“帝王之业，草创与守成孰难”。房玄龄以天下草昧、
  群雄竞起、攻破战胜说明草创之难；魏征则指出帝王之起多承衰乱，而既得天下后
  容易骄逸、徭役与侈务不息，国家衰弊常由此而起，因此守成更难。唐太宗总结说，
  房玄龄昔日随自己定天下，亲见草创之难；魏征与自己安天下，所虑在骄逸危亡，
  所以见守成之难。草创之难已经过去，今后应与群臣慎守成。
