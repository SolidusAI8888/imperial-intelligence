title: "秦二世二年：丰地叛变后刘邦失利并重新聚兵"
record_type: event
dynasty: Han
time_label: "秦二世二年"
participants:
  - liu_bang
historical_record: >-
  刘邦令雍齿守丰后，雍齿转而降魏。刘邦回军攻丰不能取，且一度因病返回沛县。
  随后他转往从景驹求兵，并在萧西作战失利；之后重新收兵，攻取砀、下邑，
  又前往项梁处获得增兵，再次回军攻丰。
