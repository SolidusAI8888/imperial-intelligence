supported_claims:
  - "景帝在七国叛乱中同时采取军事处置与斩晁错的政治让步。"
  - "斩晁错之后叛乱仍需通过军事行动才能结束，因此该决定并未单独终止危机。"
  - "重大局势的结果由皇帝决策、叛军选择、将领行动和军事结果共同塑造。"
unsupported_claims:
