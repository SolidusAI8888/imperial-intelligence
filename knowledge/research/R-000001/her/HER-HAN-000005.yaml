title: "七国之乱：斩晁错未能终止叛乱"
record_type: event
dynasty: Han
time_label: "汉景帝三年"
participants:
  - han_jingdi
historical_record: >-
  景帝三年，吴王刘濞等七国举兵反。朝廷大赦并遣周亚夫、窦婴等领兵，同时斩御史大夫晁错以谢七国。
  但叛乱并未因此立即停止，最终仍由诸将军事击破七国，吴王被追斩，其余主要叛王相继自杀。
  这一事件显示，危机中的一项重大决策并不能自动控制对手选择或保证预期结果。
