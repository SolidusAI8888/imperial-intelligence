supported_claims:
  - "宋仁宗即位初期的实际政治能动空间受到年龄、遗诏与皇太后临朝制度的明显限制。"
  - "皇太后去世后，宋仁宗开始亲政，其可直接作出的人事与政治选择显著增加。"
  - "同一个人的可控空间会随人生阶段与制度条件变化。"
