title: "少年即位与亲政：宋仁宗能动空间随阶段变化"
record_type: event
dynasty: Song
time_label: "乾兴元年至明道二年"
participants:
  - song_renzong
historical_record: >-
  赵祯少年即位后，真宗遗诏由皇太后权处军国事，朝廷实行垂帘。此后相当时期内，皇太后与皇帝共同出御听政。
  明道二年皇太后去世后，赵祯始知自己的生母为李宸妃，并开始亲政；随后裁抑请托、召还部分旧臣，调整多名执政大臣。
