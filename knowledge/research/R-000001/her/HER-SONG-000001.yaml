title: "后汉初：赵匡胤漫游无所遇后应募从军"
record_type: event
dynasty: Song
time_label: "后汉初至后周广顺初"
participants:
  - song_taizu
historical_record: >-
  《宋史》记载赵匡胤在后汉初曾漫游而无所遇，后在襄阳寺中得到老僧资助并劝其北行。
  适逢郭威以枢密使征李守真，赵匡胤应募进入军中；后周广顺初，他由军中职务逐步升迁。
