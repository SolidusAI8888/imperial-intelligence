title: "诸吕之乱后：代王刘恒被迎立为帝"
record_type: event
dynasty: Han
time_label: "高后二十七年末至汉文帝即位"
participants:
  - han_wendi
historical_record: >-
  吕后死后，陈平、周勃等诛诸吕并谋迎代王刘恒入长安。刘恒身边群臣对是否赴京意见不一：
  张武等担心京师大臣不可尽信，宋昌则认为刘氏基础与天下人心足以支撑迎立。刘恒先遣薄昭核实情况，
  又令宋昌先入长安观察。群臣奉上天子玺后，刘恒仍多次辞让，最终在宗室、将相反复请求下即帝位。
