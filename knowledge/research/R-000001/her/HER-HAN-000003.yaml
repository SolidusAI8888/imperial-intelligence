supported_claims:
  - "刘恒即位机会来自诸吕被诛后的政治重组，并非由他主动制造这一外部局势。"
  - "面对突然而来的最高权位，刘恒曾听取相反意见、派人核实并逐步确认京师局势。"
  - "刘恒在群臣多次请求后接受帝位，显示外部机会与个人判断共同构成这一人生转折。"
unsupported_claims:
  - "卜兆足以证明刘恒称帝属于不可改变的天命。"
  - "刘恒仅凭个人意志决定了诸吕之乱后的政治结果。"
  - "谨慎核实可以保证任何重大选择都获得成功。"
