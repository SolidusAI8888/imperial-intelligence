supported_claims:
  - "刘彻在少年时期继承皇位，其起点首先由继承制度与宫廷结构决定，而非由个人自主选择。"
  - "建元二年的赵绾、王臧事件说明，少年皇帝即位后仍受到太皇太后及既有政治力量的现实约束。"
  - "身份、制度位置与实际可行动空间并不完全相同。"
unsupported_claims:
  - "太皇太后能够完全决定汉武帝此后全部政治选择。"
  - "汉武帝早期受约束足以证明个人努力对人生毫无作用。"
  - "赵绾、王臧事件可以单独解释汉武帝一生的政治方向。"
