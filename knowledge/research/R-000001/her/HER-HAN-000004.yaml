title: "建元初年：少年即位与太皇太后权力约束"
record_type: event
dynasty: Han
time_label: "汉武帝建元初年"
participants:
  - han_wudi
historical_record: >-
  刘彻十六岁即皇帝位。建元初年，朝廷开始征举贤良、推动新的政治主张；到建元二年，
  御史大夫赵绾因请求政事不再奏请太皇太后，郎中令王臧亦受牵连，二人下狱自杀，
  丞相窦婴、太尉田蚡也被免职。该阶段显示，皇帝名义上的最高身份并不等于现实中不存在
  宗室、外戚与既有宫廷权力结构的约束。
