title: "秦二世元年：刘邦由亡命群体进入沛县起事"
record_type: event
dynasty: Han
time_label: "秦二世元年"
participants:
  - liu_bang
historical_record: >-
  陈胜起事后，各郡县多有响应。沛令起初欲响应陈涉，后又反悔并关闭城门。
  萧何、曹参出城投奔刘邦。刘邦以帛书射入城中，劝沛中父老诛令自立；
  父老随后杀沛令、开城迎刘邦，并推举刘邦为首。刘邦数次推让后被立为沛公。
