supported_claims:
  - "李渊的人生路径从隋臣转为起兵首领，与隋末政治秩序恶化和地方危机直接相关。"
  - "李渊在高压与不确定环境中先采取自保，再在局势变化后选择起兵。"
  - "霍邑进军前李渊曾因现实困难准备退兵，并在接受李世民劝谏后改变决定。"
unsupported_claims:
  - "李渊从任隋官时起就已确定要建立唐朝。"
  - "隋末动乱自动决定了李渊最终成功。"
  - "听从一次正确劝谏即可保证后续事业成功。"
