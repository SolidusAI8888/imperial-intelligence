record_id: HER-TANG-000007
research_id: R-000001
title: "隋末危局中：李渊由隋臣转入起兵"
record_type: event
dynasty: Tang
time_label: "隋大业九年至十三年"
participants:
  - tang_gaozu
historical_record: >-
  李渊在隋朝长期任职，并在隋炀帝猜忌加深时因被召而称疾未见，随后以纵酒等方式掩饰自保。
  大业十三年任太原留守时，天下群盗并起，李世民、刘文静等劝其举兵。李渊先募集兵众、处置王威和高君雅，
  随后正式起兵。西进途中又因久雨粮乏一度下令还师，经李世民力谏后改变决定，继续进军并攻下霍邑。
