    evidence_class:
      - first_person_response
      - reflective_statement
      - corrective_intent
    restrictions:
      - 不得把表态等同于长期行为。
      - 必须寻找后续行为、结果及晚年反思以判断其经验是否成熟或发生变化。
      - 不得据此推断未被史料明示的心理活动。

