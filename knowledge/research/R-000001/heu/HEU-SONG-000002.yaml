challenge: >-
  赵祯少年即位时，皇太后依遗诏处置军国大事；他的身份虽是皇帝，但其实际可控空间受到年龄、制度安排与既有权力结构限制。
response_or_choice:
  - "在垂帘阶段处于制度性受限的皇帝位置。"
  - "皇太后去世后开始亲政，并通过裁抑请托、召还旧臣和调整执政班子扩大自主治理。"
experienced_outcome:
  - "赵祯在同一身份之下经历了实际决策空间从受限到扩大的阶段变化。"
explicit_reflection: []
interpretation:
  - "这组经历支持：个人能动性不是固定常量；相同的人在不同年龄、制度与权力条件下，能够直接影响的范围可能明显不同。"
