challenge: >-
  唐太宗先后经历创业与守成两个阶段。隋末与武德初年的创业期面对战争、军心和进退决断；
  登基后的守成期则面对安乐之后可能出现的懈怠、骄逸与政治判断弱化。
response_or_choice:
  - "创业期在霍邑进军前反对因困难退还太原，并明确说明退兵可能导致众散敌乘。"
  - "在贞观十年主动与房玄龄、魏征讨论草创与守成之难，并明确把注意力转向守成风险。"
  - "在贞观十五年再次追问守天下之难，并继续把任贤、纳谏与警惕安乐后的宽怠作为治理重点。"
experienced_outcome:
  - "唐太宗从亲历的创业决断进入长期守成后，形成了对不同阶段风险差异的明确认识，并持续把守成风险作为需要处理的问题。"
explicit_reflection:
  - "草创之难已经过去，守成之难应与群臣共同谨慎应对。"
interpretation:
  - "这组记录支持：对唐太宗本人而言，处境改变后，风险的性质也会改变；创业期需要应对外部竞争与进退，守成期则更依赖持续自我约束和治理。"
