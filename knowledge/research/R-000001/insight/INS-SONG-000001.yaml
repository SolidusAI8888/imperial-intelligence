insight_id: INS-SONG-000001
research_id: R-000001
statement: >-
  人生转折常由个人无法单独制造的外部机会、他人行动与时代结构触发；
  但个体在关键节点的选择，以及身份变化后对新风险的处理，会继续塑造转折之后的路径。
derived_from_heus:
  - HEU-SONG-000001
applies_when:
  - "个人处于长期无明确出路、随后突然出现新机会的阶段。"
  - "身份或责任发生快速变化，需要重新处理风险。"
limits:
  - "该洞见来自军事与政治权力环境，不能把陈桥拥立直接类比普通人的职业机会。"
  - "不能据此认定所有外部机会都应接受，或重大冒险必然带来上升。"
status: reviewed
