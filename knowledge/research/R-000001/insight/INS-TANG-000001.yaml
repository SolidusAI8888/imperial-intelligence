insight_id: INS-TANG-000001
research_id: R-000001
statement: >-
  个体无法决定所处时代提供的全部条件，但其后的选择空间会随着人生阶段变化；
  成功不会终结命运，而会带来新的约束、新的风险与新的选择。
derived_from_heus:
  - HEU-TANG-000001
  - HEU-TANG-000003
applies_when:
  - "个体处于环境快速变化、身份转换或成功后的新阶段。"
  - "过去有效的行动方式不再足以处理新的约束。"
limits:
  - "该洞见来自帝王治理经验，迁移到普通个体时必须剥离特定权力结构。"
  - "不能据此主张个人选择能够克服所有结构性限制。"
status: reviewed
