insight_id: INS-HAN-000001
research_id: R-000001
statement: >-
  剧烈时代变化会重新打开或关闭个人的行动空间，但机会本身不等于结果；
  后续走向仍取决于能否组织资源、回应失败并在变化中继续调整行动。
derived_from_heus:
  - HEU-HAN-000001
applies_when:
  - "外部秩序快速变化，个人原有身份和路径被打断。"
  - "已经遭遇失败，需要判断是否以及如何重新组织资源。"
limits:
  - "该洞见来自秦末政治军事环境，不能直接等同于现代普通人的就业或生活条件。"
  - "不能据此把幸存者结果倒推为个人必然具有更强意志。"
status: reviewed
