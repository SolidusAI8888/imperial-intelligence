insight_id: INS-HAN-000004
research_id: R-000001
statement: >-
  在多人参与的危机中，个人决策可以改变局势，却无法单方面决定其他参与者如何回应；
  因此应把“我能作出选择”与“我能保证结果”严格区分。
derived_from_heus:
  - HEU-HAN-000004
applies_when:
  - "面对涉及多方利益与相互反应的复杂危机。"
  - "需要判断某个关键决定能影响多少结果，而不是把决定本身当作结果。"
limits:
  - "七国之乱是古代政治军事危机，不能把军事平叛逻辑直接套用于现代个人生活。"
  - "不能因为结果不可完全控制，就否认决策质量、执行能力和资源配置的重要性。"
status: reviewed
