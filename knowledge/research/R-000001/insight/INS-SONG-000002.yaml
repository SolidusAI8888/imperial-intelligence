research_id: R-000001
statement: >-
  个体能够影响命运的范围会随人生阶段与制度条件改变；不能因为某一阶段受限，就把这种受限误认为一生都不会变化，
  也不能因为后来拥有更大权力，就反推过去本可自由选择。
derived_from_heus:
  - HEU-SONG-000002
applies_when:
  - "个人当前受到年龄、组织层级、制度或资源条件明显限制。"
  - "需要判断眼下不能控制的部分是否可能在未来阶段发生变化。"
limits:
  - "宋仁宗经历的是皇权与垂帘制度，不能直接等同于现代组织中的普通职位。"
  - "能动空间扩大并不意味着结果可完全控制。"
