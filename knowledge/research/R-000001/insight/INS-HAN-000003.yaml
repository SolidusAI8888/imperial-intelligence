insight_id: INS-HAN-000003
research_id: R-000001
statement: >-
  名义上的身份和头衔不会自动转化为完全的现实控制力；个人的选择始终发生在既有制度、关系与权力结构中，
  因而“能做什么”既取决于个人意志，也取决于当时实际可支配的空间。
derived_from_heus:
  - HEU-HAN-000003
applies_when:
  - "个人获得新的职位、身份或权力，却发现现实行动空间仍受既有结构制约。"
  - "需要区分名义权力、实际资源与真正可执行的选择。"
limits:
  - "该洞见来自汉初宫廷政治，不应把古代皇权结构直接等同于现代组织。"
  - "受结构约束不意味着个人没有选择，也不能据此否定后续行动可能扩大实际空间。"
status: reviewed
