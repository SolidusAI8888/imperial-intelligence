problem_id: Q-FATE-AGENCY-001
raw_question: 面对浩瀚的历史和剧烈的时代变革，个体的命运到底由谁主宰？
normalized_question: 在强大时代结构、偶然事件、他人力量与个人选择共同作用时，个体命运在多大程度上仍可由自身行动塑造？
core_tensions:
  - 个体能动性与时代结构之间的张力
  - 选择与偶然性之间的张力
  - 个人意志与他人/组织/权力关系之间的张力
  - 短期成败与完整人生结果之间的张力
  - 顺势而为与主动改变处境之间的张力
retrieval_dimensions:
  - 出身、身份或初始条件受限，但后续轨迹发生显著改变的经历
  - 身处战争、政权更替、制度变动、社会危机等剧烈时代变化中的个人选择
  - 同处相似环境而因不同决策产生不同结果的可比较经历
  - 外部偶然事件显著改变个人轨迹，但人物仍通过后续行动重新塑造结果的经历
  - 个人努力未能克服结构性约束或时代大势的经历
  - 因识势、借势、等待时机、改变联盟或调整策略而改变命运的经历
  - 因误判时势、执念、过度自信或拒绝调整而付出代价的经历
  - 人物晚年对自身成败、时势、天命、人事、用人或选择进行反思的材料
  - 同一人物一生中能动性、运气、结构与他人作用此消彼长的经验链
  - 能形成反例或限制条件、避免把“努力决定一切”或“时代决定一切”绝对化的经历
temporal_horizon: existential
agency_structure:
  individual_agency: 0.9
  structural_forces: 0.9
  contingency_or_luck: 0.8
  interpersonal_forces: 0.7
desired_answer_mode:
  - 先讲述回答者本人真实经历过的高度相关人生经验
  - 区分哪些因素可控、部分可控与不可控
  - 给出经过完整生命周期检验后的反思，而非只取成功时期的经验
  - 同时承认时代结构与个人行动的作用，避免单因解释
  - 最终给出现代个体可执行、但不过度承诺结果的建议
exclusions:
  - 不预设唐太宗或任何历史人物为回答者
  - 不把“天命”“命数”等词汇自动解释为宿命论
  - 不把历史结果倒推为当事人在当时必然能够预见
  - 不以最终成功者样本单独证明个人能动性
  - 不因人物身份高低而预设经验相关性
  - 不用后世评价替代当事人的真实经历与同期史料
status: retrieval_ready
