name: Phase 2 Source Ingestion

on:
  workflow_dispatch:
    inputs:
      source_id:
        description: Optional Phase 2 source ID; blank selects the next incomplete source
        required: false
        type: string
  schedule:
    - cron: "17 * * * *"
  push:
    branches: [main]
    paths:
      - ".github/workflows/phase2-source-ingestion.yml"
      - "history/source_registry/phase2_core_histories.yaml"
      - "history/tools/ingest_wikisource_manifest.py"
      - "history/tools/select_next_phase2_source.py"

permissions:
  contents: write

concurrency:
  group: phase2-source-ingestion
  cancel-in-progress: false

jobs:
  ingest-next-source:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ingestion dependencies
        run: pip install requests beautifulsoup4 PyYAML

      - name: Select source
        id: select
        env:
          REQUESTED_SOURCE: ${{ inputs.source_id }}
        run: |
          if [ -n "$REQUESTED_SOURCE" ]; then
            SOURCE_ID="$REQUESTED_SOURCE"
          else
            SOURCE_ID="$(python history/tools/select_next_phase2_source.py)"
          fi
          echo "source_id=$SOURCE_ID" >> "$GITHUB_OUTPUT"
          echo "Selected source: ${SOURCE_ID:-<none>}"

      - name: Ingest selected source
        id: ingest
        if: steps.select.outputs.source_id != ''
        continue-on-error: true
        run: |
          python history/tools/ingest_wikisource_manifest.py \
            --manifest history/source_registry/phase2_core_histories.yaml \
            --source-id "${{ steps.select.outputs.source_id }}"

      - name: Commit archival progress
        if: steps.select.outputs.source_id != ''
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add history/source_corpus/china
          if git diff --cached --quiet; then
            echo "No corpus changes to commit"
          else
            git commit -m "Archive Phase 2 source ${{ steps.select.outputs.source_id }}"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Show Phase 2 status
        run: python history/tools/select_next_phase2_source.py --json

      - name: Fail if ingestion had errors
        if: steps.select.outputs.source_id != '' && steps.ingest.outcome == 'failure'
        run: exit 1
