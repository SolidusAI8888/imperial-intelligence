name: Ingest Phase 1 Historical Corpus

# Full corpus ingestion is intentionally manual. Large-scale archival ingestion should
# run locally on the Mac mini to avoid consuming GitHub Actions minutes. This workflow
# remains available only for explicit manual recovery/verification.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/source-corpus-v1
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install ingestion dependencies
        run: python -m pip install requests beautifulsoup4 pyyaml

      - name: Re-archive phase 1 sources with extractor V3
        id: ingest
        shell: bash
        run: |
          set +e
          STATUS=0
          SOURCES=(
            CN-HAN-0001 CN-HAN-0002 CN-HAN-0003
            CN-TANG-0001 CN-TANG-0002 CN-TANG-0003 CN-TANG-0004
            CN-SONG-0001
          )
          for SRC in "${SOURCES[@]}"; do
            echo "=== $SRC ==="
            python history/tools/ingest_wikisource_phase1.py --source-id "$SRC"
            RC=$?
            if [ $RC -ne 0 ]; then STATUS=1; fi

            git config user.name 'imperial-intelligence-bot'
            git config user.email 'actions@users.noreply.github.com'
            git add history/source_corpus
            if ! git diff --cached --quiet; then
              git commit -m "Archive $SRC source corpus extractor v3 checkpoint"
              git push origin HEAD:feature/source-corpus-v1
            fi
          done
          echo "status=$STATUS" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Audit complete phase 1 corpus
        id: audit
        continue-on-error: true
        run: python history/tools/audit_phase1_corpus.py

      - name: Commit final audit summary
        if: always()
        run: |
          git config user.name 'imperial-intelligence-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add history/source_corpus/PHASE1_INGESTION_SUMMARY.json
          if ! git diff --cached --quiet; then
            git commit -m 'Audit Han Tang Song phase 1 source corpus v3'
            git push origin HEAD:feature/source-corpus-v1
          fi

      - name: Fail if corpus remains incomplete
        if: steps.audit.outcome == 'failure' || steps.ingest.outputs.status != '0'
        run: |
          echo 'Phase 1 corpus is not yet complete. Run the V3 ingestion locally and re-audit before entering the Knowledge Layer.'
          exit 1
