name: Ingest Phase 1 Historical Corpus

on:
  push:
    branches:
      - feature/source-corpus-v1
    paths:
      - 'history/tools/ingest_wikisource_phase1.py'
      - 'history/source_registry/phase1_sources.yaml'
      - '.github/workflows/ingest-phase1-history.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/source-corpus-v1
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install ingestion dependencies
        run: python -m pip install requests beautifulsoup4 pyyaml
      - name: Ingest full phase 1 corpus
        run: python history/tools/ingest_wikisource_phase1.py
      - name: Commit archived corpus
        run: |
          git config user.name 'imperial-intelligence-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add history/source_corpus
          if git diff --cached --quiet; then
            echo 'No corpus changes.'
          else
            git commit -m 'Archive Han Tang Song phase 1 source corpus'
            git push origin HEAD:feature/source-corpus-v1
          fi
