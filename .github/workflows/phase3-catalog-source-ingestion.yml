name: Phase 3 Catalog Source Ingestion

on:
  workflow_dispatch:
    inputs:
      source_id:
        description: Optional catalog-aware source ID; blank selects the next incomplete host archive
        required: false
        type: string
  schedule:
    - cron: "43 2 * * *"
  push:
    branches: [main]
    paths:
      - ".github/workflows/phase3-catalog-source-ingestion.yml"
      - "history/source_registry/phase3_catalog_sources.yaml"
      - "history/tools/ingest_wikisource_catalog.py"
      - "history/tools/select_next_phase3_catalog_source.py"

permissions:
  contents: write

concurrency:
  group: phase3-catalog-source-ingestion
  cancel-in-progress: false

jobs:
  ingest-catalog-source:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ingestion dependencies
        run: pip install requests beautifulsoup4 PyYAML

      - name: Resolve source id
        id: source
        env:
          REQUESTED: ${{ inputs.source_id }}
        run: |
          if [ -n "$REQUESTED" ]; then
            SOURCE_ID="$REQUESTED"
          else
            SOURCE_ID="$(python history/tools/select_next_phase3_catalog_source.py)"
          fi
          echo "source_id=$SOURCE_ID" >> "$GITHUB_OUTPUT"
          echo "Selected catalog-aware source: ${SOURCE_ID:-<none>}"

      - name: Archive catalog-aware source
        id: ingest
        if: steps.source.outputs.source_id != ''
        continue-on-error: true
        run: |
          python history/tools/ingest_wikisource_catalog.py \
            --manifest history/source_registry/phase3_catalog_sources.yaml \
            --source-id "${{ steps.source.outputs.source_id }}"

      - name: Commit archival progress
        if: steps.source.outputs.source_id != ''
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add history/source_corpus/china
          if git diff --cached --quiet; then
            echo "No catalog corpus changes to commit"
          else
            git commit -m "Archive Phase 3 catalog source ${{ steps.source.outputs.source_id }}"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Show catalog archive status
        if: always()
        run: python history/tools/select_next_phase3_catalog_source.py --json

      - name: Preserve incomplete-host safety
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path("history/source_corpus/china")
          for p in root.glob("*/**/ingestion_report.json"):
              try:
                  d = json.loads(p.read_text(encoding="utf-8"))
              except Exception:
                  continue
              if d.get("acquisition_strategy") != "wikisource_catalog_children":
                  continue
              print(p, {k: d.get(k) for k in ["discovered_page_count", "archived_file_pairs", "archive_scope_complete", "source_complete", "host_completeness"]})
              if d.get("host_completeness") == "explicitly_incomplete" and d.get("source_complete"):
                  raise SystemExit(f"Safety violation: incomplete host promoted to source_complete: {p}")
          PY

      - name: Fail if ingestion had errors
        if: steps.source.outputs.source_id != '' && steps.ingest.outcome == 'failure'
        run: exit 1
