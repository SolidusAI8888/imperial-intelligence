name: Phase 3 Catalog Source Ingestion

on:
  workflow_dispatch:
    inputs:
      source_id:
        description: Catalog-aware source ID
        required: false
        default: CN-QING-0001
        type: string
  schedule:
    - cron: "43 2 * * *"
  push:
    branches: [main]
    paths:
      - ".github/workflows/phase3-catalog-source-ingestion.yml"
      - "history/source_registry/phase3_catalog_sources.yaml"
      - "history/tools/ingest_wikisource_catalog.py"

permissions:
  contents: write

concurrency:
  group: phase3-catalog-source-ingestion
  cancel-in-progress: false

jobs:
  ingest-catalog-source:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ingestion dependencies
        run: pip install requests beautifulsoup4 PyYAML

      - name: Resolve source id
        id: source
        env:
          REQUESTED: ${{ inputs.source_id }}
        run: |
          SOURCE_ID="${REQUESTED:-CN-QING-0001}"
          echo "source_id=$SOURCE_ID" >> "$GITHUB_OUTPUT"
          echo "Selected catalog-aware source: $SOURCE_ID"

      - name: Archive catalog-aware source
        id: ingest
        continue-on-error: true
        run: |
          python history/tools/ingest_wikisource_catalog.py \
            --manifest history/source_registry/phase3_catalog_sources.yaml \
            --source-id "${{ steps.source.outputs.source_id }}"

      - name: Commit archival progress
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add history/source_corpus/china
          if git diff --cached --quiet; then
            echo "No catalog corpus changes to commit"
          else
            git commit -m "Archive Phase 3 catalog source ${{ steps.source.outputs.source_id }}"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Preserve incomplete-host safety
        if: always()
        run: |
          REPORT="history/source_corpus/china/qing/qing_shilu/ingestion_report.json"
          if [ -f "$REPORT" ]; then
            python - <<'PY'
          import json
          from pathlib import Path
          p = Path("history/source_corpus/china/qing/qing_shilu/ingestion_report.json")
          d = json.loads(p.read_text(encoding="utf-8"))
          print(json.dumps({k: d.get(k) for k in ["discovered_page_count", "archived_file_pairs", "archive_scope_complete", "source_complete", "host_completeness"]}, ensure_ascii=False, indent=2))
          if d.get("host_completeness") == "explicitly_incomplete" and d.get("source_complete"):
              raise SystemExit("Safety violation: incomplete host was promoted to source_complete")
          PY
          fi

      - name: Fail if ingestion had errors
        if: steps.ingest.outcome == 'failure'
        run: exit 1
