version: 2.0
name: Historical Experience Unit
abbreviation: HEU
purpose: >-
  Represent a historically grounded life-experience unit that connects verified historical
  evidence to historically supported interpretation, reflection, insight, and modern problem
  matching without storing a final user-specific answer.

principles:
  - history_first
  - experience_first
  - interpretation_is_evidence_bound
  - distinguish_event_from_interpretation
  - distinguish_immediate_from_retrospective_reflection
  - complete_life_perspective_by_default
  - no_future_knowledge_at_event_time
  - insight_next
  - advice_last
  - no_fabricated_first_person
  - final_decision_belongs_to_user

required_fields:
  - heu_id
  - persona_id
  - title
  - related_event_ids
  - historical_question
  - historical_context
  - options_considered
  - chosen_action
  - reasoning
  - outcome
  - historical_interpretation
  - reflections
  - historical_insight
  - modern_applicable_scenarios
  - limitations
  - evidence_chain
  - confidence
  - review_status

field_definitions:
  heu_id:
    type: string
    pattern: '^HEU-[A-Z0-9_-]+$'
  persona_id:
    type: string
  title:
    type: string
  related_event_ids:
    type: list[string]
    min_items: 1
  historical_question:
    type: string
    description: The actual dilemma or decision problem faced in the historical situation.
  historical_context:
    type: string
    description: Factual background needed to understand why the problem arose.
  options_considered:
    type: list[object]
    item_fields:
      option: string
      evidence_level: [direct, supported_inference, uncertain]
      support_ids: list[string]
  chosen_action:
    type: string
  reasoning:
    type: object
    fields:
      summary: string
      evidence_level: [direct, supported_inference, uncertain]
      support_ids: list[string]
      caution: string
    description: >-
      Reconstruction of why the historical actor may have acted as recorded. Later knowledge
      must never be projected backward into this field.
  outcome:
    type: object
    fields:
      immediate: string
      later: string
      costs_or_tradeoffs: list[string]
      support_ids: list[string]
  historical_interpretation:
    type: object
    required_fields:
      summary
      interpretation_type
      evidence_strength
      support_ids
      caution
    fields:
      summary: string
      interpretation_type:
        type: [self_interpretation, contemporary_interpretation, later_historical_interpretation, system_synthesis]
      evidence_strength:
        type: [strong, medium, tentative]
      support_ids: list[string]
      source_scope_note: string
      caution: string
    description: >-
      A clearly labelled interpretation of the event and its meaning. Interpretation is not fact.
      Self-interpretation from the historical actor should be preferred when available; later or
      system interpretation must remain separately labelled.
  reflections:
    type: list[object]
    min_items: 1
    item_fields:
      reflection_type: [immediate, retrospective, lifetime]
      chronology: string
      summary: string
      evidence_level: [direct, supported_inference, later_interpretation, unavailable]
      support_ids: list[string]
      hindsight_boundary: string
    description: >-
      Records what the persona thought or later concluded at different points in life. The default
      consultation runtime may use the complete lifetime set, but must distinguish what was known
      at the time from what was understood only later.
  historical_insight:
    type: object
    fields:
      statement: string
      derivation: string
      confidence: [low, medium, high]
      supporting_event_ids: list[string]
      supporting_claim_ids: list[string]
      supporting_interpretation_ids: list[string]
  modern_applicable_scenarios:
    type: list[object]
    item_fields:
      scenario: string
      transferable_structure: string
      caution: string
  limitations:
    type: list[string]
    description: Conditions under which the historical experience should not be transferred directly.
  evidence_chain:
    type: object
    fields:
      source_ids: list[string]
      passage_ids: list[string]
      claim_ids: list[string]
      event_ids: list[string]
      interpretation_ids: list[string]
  confidence:
    type: object
    fields:
      factual: [low, medium, high]
      reasoning: [low, medium, high]
      interpretation: [low, medium, high]
      reflection: [low, medium, high]
      transferability: [low, medium, high]
  review_status:
    type: [draft, verified, approved, rejected]

runtime_rules:
  - A HEU may not contain a final user-specific recommendation.
  - A persona answer may use a HEU only after the evidence chain is resolved.
  - Historical facts and historical interpretation must remain separate.
  - Interpretation must identify whether it comes from the actor, a contemporary, a later historian, or system synthesis.
  - First-person narration may state a reflection as the persona's own only when supported by actor-linked evidence.
  - The default persona runtime uses complete_life perspective and may draw on retrospective and lifetime reflections.
  - Complete-life perspective does not permit retroactive future knowledge: later reflection must never be presented as knowledge held at the time of the original event.
  - First-person narration must disclose uncertainty when reasoning or reflection is inferred.
  - If no sufficiently similar HEU exists, the runtime must not fabricate one.
  - Persona recommendation should rank HEUs first, then select the persona who owns the best-matching HEU.
