  - passage_id: JTS-V02-P002
    chronology: 武德九年六月
    topic_hint: xuanwu_gate_and_power_transition
    original_text: >-
      九年，皇太子建成、齊王元吉謀害太宗。六月四日，太宗率長孫無忌、尉遲敬德、房玄齡、杜如晦、宇文士及、高士廉、侯君集、程知節、秦叔寶、段志玄、屈突通、張士貴等於玄武門誅之。甲子，立為皇太子，庶政皆斷決。太宗乃縱禁苑所養鷹犬，並停諸方所進珍異，政尚簡肅，天下大悅。又令百官各上封事，備陳安人理國之要。
    locator:
      digital_witness: Wikisource 舊唐書/卷2
      source_line_hint: 153
    extraction_status: reviewed_for_sample

  - passage_id: JTS-V02-P003
    chronology: 貞觀三年二月
    topic_hint: appointment_of_fang_du_li_wei
    original_text: >-
      二月戊寅，中書令、邢國公房玄齡為尚書左僕射，兵部尚書、檢校侍中、蔡國公杜如晦為尚書右僕射，刑部尚書、檢校中書令、永康縣公李靖為兵部尚書，右丞魏徵為守秘書監，參預朝政。
    locator:
