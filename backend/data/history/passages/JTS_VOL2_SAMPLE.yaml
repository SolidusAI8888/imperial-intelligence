  - passage_id: JTS-V02-P001
    chronology: 武德七年
    topic_hint: migration_of_capital_and_frontier_pressure
    original_text: >-
      有說高祖云：「只為府藏子女在京師，故突厥來，若燒卻長安而不都，則胡寇自止。」高祖乃遣中書侍郎宇文士及行山南可居之地，即欲移都。蕭瑀等皆以為非，然終不敢犯顏正諫。太宗獨曰：「霍去病，漢廷之將帥耳，猶且志滅匈奴。臣忝備籓維，尚使胡塵不息，遂令陛下議欲遷都，此臣之責也。幸乞聽臣一申微效，取彼頡利。若一兩年間不繫其頸，徐建移都之策，臣當不敢復言。」高祖怒，仍遣太宗將三十餘騎行刬。還日，固奏必不可移都，高祖遂止。
    locator:
      digital_witness: Wikisource 舊唐書/卷2
