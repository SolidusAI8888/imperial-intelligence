    locator_note: 武德九年玄武门与即位
    original_text_excerpt: >-
      九年六月，太宗以兵入玄武门，杀太子建成及齐王元吉。高祖大惊，乃以太宗为皇太子。八月甲子，即皇帝位于东宫显德殿。
