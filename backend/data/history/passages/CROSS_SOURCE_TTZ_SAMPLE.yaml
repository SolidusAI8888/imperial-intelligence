    chapter: 卷191 唐纪七 武德七年
    locator_note: 迁都议与秦王世民反对迁都
    original_text_excerpt: >-
      或说上曰，突厥所以屡寇关中者，以子女玉帛皆在长安故也……秦王世民谏曰，戎狄为患，自古有之……奈何以胡寇扰边，遽迁都以避之……愿假数年之期，请系颉利之颈，致之阙下。上曰善……上乃止。
