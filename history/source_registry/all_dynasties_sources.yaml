version: 1
scope: all_chinese_dynasties
status: expansion_registry
policy: >-
  The project-wide source corpus is no longer limited to the Han/Tang/Song Phase 1 sample.
  Collection expands across the full imperial historical sequence. Existing phase1_sources.yaml
  remains a completed ingestion batch; this registry defines the broader collection universe.
source_groups:
  core_dynastic_histories:
    - {source_key: shiji, title: 史記, coverage: 先秦至漢初, existing_source_id: CN-HAN-0001}
    - {source_key: hanshu, title: 漢書, coverage: 西漢, existing_source_id: CN-HAN-0002}
    - {source_key: houhanshu, title: 後漢書, coverage: 東漢, existing_source_id: CN-HAN-0003}
    - {source_key: sanguozhi, title: 三國志, coverage: 三國}
    - {source_key: jinshu, title: 晉書, coverage: 晉}
    - {source_key: songshu, title: 宋書, coverage: 劉宋}
    - {source_key: nanqishu, title: 南齊書, coverage: 南齊}
    - {source_key: liangshu, title: 梁書, coverage: 梁}
    - {source_key: chenshu, title: 陳書, coverage: 陳}
    - {source_key: weishu, title: 魏書, coverage: 北魏}
    - {source_key: beinqishu, title: 北齊書, coverage: 北齊}
    - {source_key: zhoushu, title: 周書, coverage: 北周}
    - {source_key: suishu, title: 隋書, coverage: 隋}
    - {source_key: nanshi, title: 南史, coverage: 南朝}
    - {source_key: beishi, title: 北史, coverage: 北朝}
    - {source_key: jiutangshu, title: 舊唐書, coverage: 唐, existing_source_id: CN-TANG-0001}
    - {source_key: xintangshu, title: 新唐書, coverage: 唐, existing_source_id: CN-TANG-0002}
    - {source_key: jiuwudaishi, title: 舊五代史, coverage: 五代}
    - {source_key: xinwudaishi, title: 新五代史, coverage: 五代}
    - {source_key: songshi, title: 宋史, coverage: 宋, existing_source_id: CN-SONG-0001}
    - {source_key: liaoshi, title: 遼史, coverage: 遼}
    - {source_key: jinshi, title: 金史, coverage: 金}
    - {source_key: yuanshi, title: 元史, coverage: 元}
    - {source_key: mingshi, title: 明史, coverage: 明}
  chronological_and_governance_corpora:
    - {source_key: zizhitongjian, title: 資治通鑑, coverage: 戰國至五代, existing_partial_source_id: CN-TANG-0003}
    - {source_key: zhenguanzhengyao, title: 貞觀政要, coverage: 唐太宗, existing_source_id: CN-TANG-0004}
    - {source_key: tanghuiyao, title: 唐會要, coverage: 唐}
    - {source_key: wudaihuiyao, title: 五代會要, coverage: 五代}
    - {source_key: songhuiyaojigao, title: 宋會要輯稿, coverage: 宋}
    - {source_key: wenxian_tongkao, title: 文獻通考, coverage: 上古至宋}
    - {source_key: yuan_dianzhang, title: 元典章, coverage: 元}
    - {source_key: daming_huidian, title: 大明會典, coverage: 明}
    - {source_key: ming_shilu, title: 明實錄, coverage: 明}
    - {source_key: daqing_huidian, title: 大清會典, coverage: 清}
    - {source_key: qing_shilu, title: 清實錄, coverage: 清}
    - {source_key: qing_shigao, title: 清史稿, coverage: 清, source_note: 後世編纂史稿，與實錄類來源分級使用}
collection_rules:
  - Preserve full source text and source/version metadata before downstream extraction.
  - Assign stable source IDs before ingestion; never recycle an existing source ID.
  - Use the extractor-v3 canonical passage/archive-pair format for all new compatible text corpora.
  - Maintain dynasty/source coverage reports so missing dynasties and missing volumes are machine-detectable.
  - Do not label the all-dynasties corpus complete until every registered source has an explicit ingestion or documented-unavailable status.
