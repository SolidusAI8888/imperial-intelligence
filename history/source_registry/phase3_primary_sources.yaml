version: 1
status: active_collection
policy: >-
  Phase 3 expands beyond the completed core dynastic histories into high-value primary and
  near-primary governance corpora. A source is not considered ingested merely because it is
  registered here. Every source must end in one of: ingested, documented_unavailable, or
  blocked_with_reason. Qing and Ming institutional/imperial records are prioritized before
  lower-priority auxiliary compilations.
priority_order:
  - qing_core
  - ming_core
  - comprehensive_chronology
  - huiyao_and_institutional
  - auxiliary_qing
